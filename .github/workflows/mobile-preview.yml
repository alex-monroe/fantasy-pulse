name: Mobile preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-preview.yml'

# Cancel any in-flight preview for the same PR if a new push arrives —
# only the latest commit's preview matters.
concurrency:
  group: mobile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Publish preview update + post QR comment
        uses: expo/expo-github-action/preview@v8
        env:
          # EXPO_PUBLIC_* env vars are inlined into the JS bundle by Metro
          # at export time. Without these set, the supabase client throws at
          # module import on the device and the app crashes silently (prod
          # builds don't show the red-screen error overlay).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          working-directory: apps/mobile
          # NB: avoid `#` in the message string — YAML treats ` # ` (space-hash)
          # as a comment delimiter even mid-line, which truncates the command.
          # The action appends `--json` itself; do not add it here.
          command: eas update --branch pr-${{ github.event.pull_request.number }} --message "PR ${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}" --non-interactive
