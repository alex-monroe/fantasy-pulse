<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roster Loom Connector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="icons/icon48.png" alt="" width="28" height="28" />
      <div>
        <h1>Roster Loom Connector</h1>
        <p class="subtitle">ESPN sign-in values for private leagues</p>
      </div>
    </header>

    <div id="status" class="status status--loading" role="status">Reading ESPN cookies&hellip;</div>

    <main id="fields" class="fields" hidden></main>

    <footer class="footer">
      <p class="promise">
        These values stay on this device. The extension makes no network
        requests and has no access to any site other than espn.com.
      </p>
      <a class="link" href="https://www.rosterloom.com/integrations/espn" target="_blank" rel="noreferrer noopener"
        >Open Roster Loom's ESPN page</a
      >
      <p class="disclaimer">Not affiliated with, endorsed by, or sponsored by ESPN.</p>
    </footer>

    <template id="field-template">
      <section class="field">
        <div class="field__head">
          <span class="field__label"></span>
          <button class="ghost" type="button" data-role="reveal" aria-pressed="false">Show</button>
        </div>
        <output class="field__value" data-role="value"></output>
        <button class="copy" type="button" data-role="copy"></button>
      </section>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
