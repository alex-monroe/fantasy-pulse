# Local Supabase stack for development.
#
# `npm run db:start` boots Postgres, GoTrue (auth) and the rest in Docker,
# applies everything in supabase/migrations/, then runs supabase/seed.sql.
# You get a private database carrying the real schema — no credentials to
# the shared OttoneuDB project, and migrations are safe to experiment with.
#
# The ports below are offset from the Supabase defaults (54321+) only where
# needed to stay clear of the app's own 9002.

project_id = "fantasy-pulse"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Catches every outbound email locally (signup confirmations, magic links)
# and shows them at http://127.0.0.1:54324 instead of sending them.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:9002"
additional_redirect_urls = ["http://localhost:9002"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
# Off locally so the seeded test account and any account you register can
# sign in immediately. The hosted project keeps confirmation on.
enable_confirmations = false

[analytics]
enabled = false
